<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 108" role="img" aria-labelledby="title desc">
  <title id="title">Fornost Security</title>
  <desc id="desc">Fornost Security enterprise logo with a folded teal and orange F symbol.</desc>
  <defs>
    <linearGradient id="tealTop" x1="0" y1="0" x2="1" y2="0.9">
      <stop offset="0" stop-color="#0b635c"/>
      <stop offset="0.52" stop-color="#18ae9b"/>
      <stop offset="1" stop-color="#59e1ca"/>
    </linearGradient>
    <linearGradient id="tealMid" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#063d39"/>
      <stop offset="0.56" stop-color="#0b7169"/>
      <stop offset="1" stop-color="#2cc7b1"/>
    </linearGradient>
    <linearGradient id="tealSide" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#35d7c0"/>
      <stop offset="0.6" stop-color="#0a776d"/>
      <stop offset="1" stop-color="#064b46"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffd05a"/>
      <stop offset="0.45" stop-color="#ff941f"/>
      <stop offset="1" stop-color="#dc600b"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9efed"/>
    </linearGradient>
    <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Compact folded-F brand mark -->
  <g transform="translate(7 5)" filter="url(#softGlow)">
    <path d="M19 18C19 8 27 1 37 1h78l-15 17c-5 6-10 8-18 8H45v68L19 78Z" fill="url(#tealSide)"/>
    <path d="M37 1h78l-15 17c-5 6-10 8-18 8H45C45 14 41 7 37 1Z" fill="url(#tealTop)"/>
    <path d="M45 40h59L91 55c-5 6-10 8-18 8H45Z" fill="url(#tealMid)"/>
    <path d="M45 47c0-5 4-9 9-9h15v58L45 80Z" fill="url(#amber)"/>
    <path d="M45 47c0-5 4-9 9-9h11c-10 7-16 18-20 31Z" fill="#ffcb4f" opacity=".72"/>
  </g>

  <!-- Enterprise wordmark -->
  <text x="145" y="51" fill="url(#word)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="37" font-weight="750" letter-spacing="7.2">FORNOST</text>
  <text x="149" y="80" fill="#9caaa6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="600" letter-spacing="9.2">SECURITY</text>
  <line x1="149" y1="94" x2="226" y2="94" stroke="#28c5ae" stroke-width="1.4" opacity=".75"/>
  <line x1="226" y1="94" x2="285" y2="94" stroke="#f47b20" stroke-width="1.4" opacity=".78"/>
</svg>
