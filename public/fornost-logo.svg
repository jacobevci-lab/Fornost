<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" role="img" aria-labelledby="title desc">
  <title id="title">Fornost Security</title>
  <desc id="desc">Fornost Security logo in teal, green and orange.</desc>
  <defs>
    <linearGradient id="tealA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b5e57"/>
      <stop offset="0.55" stop-color="#17a996"/>
      <stop offset="1" stop-color="#55e0c8"/>
    </linearGradient>
    <linearGradient id="tealB" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#063b38"/>
      <stop offset="1" stop-color="#119f91"/>
    </linearGradient>
    <linearGradient id="orangeA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffbd4a"/>
      <stop offset="0.45" stop-color="#ff8a20"/>
      <stop offset="1" stop-color="#d95c08"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe8e5"/>
    </linearGradient>
  </defs>

  <!-- Folded F symbol -->
  <g transform="translate(4 5)">
    <path d="M28 10c0-5 4-9 9-9h86l-17 18c-4 4-8 6-14 6H52v69L28 79Z" fill="url(#tealA)"/>
    <path d="M28 10c0-5 4-9 9-9h18L40 18c-8 9-12 18-12 29Z" fill="#4de0c9" opacity=".88"/>
    <path d="M52 38h58L96 54c-4 5-9 7-15 7H52Z" fill="url(#tealB)"/>
    <path d="M52 48c0-5 4-9 9-9h16L64 53c-8 9-12 18-12 30Z" fill="#f7a437" opacity=".9"/>
    <path d="M52 49c0-5 4-9 9-9h10v64L52 92Z" fill="url(#orangeA)"/>
  </g>

  <!-- Wordmark -->
  <text x="150" y="57" fill="url(#word)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="43" font-weight="700" letter-spacing="8">FORNOST</text>
  <text x="154" y="88" fill="#a9b8b4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" letter-spacing="10">SECURITY</text>
  <circle cx="152" cy="104" r="2" fill="#18b6a1"/>
  <line x1="160" y1="104" x2="248" y2="104" stroke="#18b6a1" stroke-width="1" opacity=".6"/>
  <line x1="248" y1="104" x2="326" y2="104" stroke="#f47920" stroke-width="1" opacity=".65"/>
</svg>
