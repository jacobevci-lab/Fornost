name: DAST

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    name: OWASP ZAP Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify production edge, redirects and TLS policy
        shell: bash
        run: |
          set -euo pipefail
          APEX="https://fornostsecurity.com/"

          # Cloudflare deployment can race the GitHub push. Wait until the new HSTS policy is live.
          for attempt in $(seq 1 12); do
            HEADERS=$(curl --fail --silent --show-error --head --retry 2 --retry-delay 3 --max-time 20 "$APEX" || true)
            if grep -Eqi '^strict-transport-security:[[:space:]]*max-age=31536000' <<<"$HEADERS"; then
              echo "HSTS is live on attempt $attempt."
              break
            fi
            if [[ "$attempt" -eq 12 ]]; then
              echo "Expected HSTS header was not observed after waiting for deployment."
              exit 1
            fi
            sleep 10
          done

          grep -Eqi '^content-security-policy:' <<<"$HEADERS"
          grep -Eqi '^x-content-type-options:[[:space:]]*nosniff' <<<"$HEADERS"
          grep -Eqi '^x-frame-options:[[:space:]]*DENY' <<<"$HEADERS"
          grep -Eqi '^permissions-policy:' <<<"$HEADERS"

          HTTP_STATUS=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' http://fornostsecurity.com/)
          HTTP_LOCATION=$(curl --silent --show-error --head http://fornostsecurity.com/ | awk 'BEGIN{IGNORECASE=1} /^location:/{gsub("\r",""); print $2; exit}')
          [[ "$HTTP_STATUS" =~ ^30[18]$ ]]
          [[ "$HTTP_LOCATION" == https://fornostsecurity.com/* ]]

          WWW_STATUS=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://www.fornostsecurity.com/)
          WWW_LOCATION=$(curl --silent --show-error --head https://www.fornostsecurity.com/ | awk 'BEGIN{IGNORECASE=1} /^location:/{gsub("\r",""); print $2; exit}')
          [[ "$WWW_STATUS" =~ ^30[18]$ ]]
          [[ "$WWW_LOCATION" == https://fornostsecurity.com/* ]]

          FINAL_WWW=$(curl --silent --show-error --location --output /dev/null --write-out '%{url_effective}' http://www.fornostsecurity.com/)
          [[ "$FINAL_WWW" == https://fornostsecurity.com/* ]]

          curl --tlsv1.2 --tls-max 1.2 --fail --silent --show-error --output /dev/null "$APEX"
          curl --tlsv1.3 --tls-max 1.3 --fail --silent --show-error --output /dev/null "$APEX"
          if curl --tls-max 1.1 --connect-timeout 10 --fail --silent --show-error --output /dev/null "$APEX"; then
            echo "Legacy TLS <=1.1 unexpectedly succeeded."
            exit 1
          else
            echo "Legacy TLS <=1.1 correctly rejected."
          fi

          TRACE_STATUS=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' -X TRACE "$APEX")
          if [[ "$TRACE_STATUS" == "200" ]]; then
            echo "TRACE unexpectedly returned 200."
            exit 1
          fi
          echo "TRACE returned $TRACE_STATUS (accepted as rejected/non-success)."

      - name: OWASP ZAP passive baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: "https://fornostsecurity.com/"
          allow_issue_writing: false
          fail_action: false
          artifact_name: "zap-baseline-report"
          cmd_options: '-a -m 2'

      - name: Summarize ZAP alerts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f report_json.json ]]; then
            echo "ZAP JSON report not found; inspect the ZAP step and artifact."
            exit 0
          fi
          python3 - <<'PY'
          import json
          from collections import Counter
          with open('report_json.json', encoding='utf-8') as f:
              report = json.load(f)
          alerts = []
          for site in report.get('site', []):
              alerts.extend(site.get('alerts', []))
          risks = Counter(a.get('riskdesc', 'Unknown').split(' ')[0] for a in alerts)
          print(f'ZAP alert groups: {len(alerts)}')
          print('Risk summary:', dict(risks))
          for a in alerts:
              print(f"- [{a.get('riskdesc','Unknown')}] {a.get('name','Unnamed alert')} (plugin {a.get('pluginid','?')})")
          PY
