name: DAST

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    name: OWASP ZAP Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify production target is reachable
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 6 --retry-delay 10 --max-time 20 \
            --output /dev/null https://fornostsecurity.com/

      - name: OWASP ZAP passive baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: "https://fornostsecurity.com/"
          allow_issue_writing: false
          fail_action: false
          artifact_name: "zap-baseline-report"
          cmd_options: '-a -m 2'

      - name: Summarize ZAP alerts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f report_json.json ]]; then
            echo "ZAP JSON report not found; inspect the ZAP step and artifact."
            exit 0
          fi
          python3 - <<'PY'
          import json
          from collections import Counter
          with open('report_json.json', encoding='utf-8') as f:
              report = json.load(f)
          alerts = []
          for site in report.get('site', []):
              alerts.extend(site.get('alerts', []))
          risks = Counter(a.get('riskdesc', 'Unknown').split(' ')[0] for a in alerts)
          print(f'ZAP alert groups: {len(alerts)}')
          print('Risk summary:', dict(risks))
          for a in alerts:
              print(f"- [{a.get('riskdesc','Unknown')}] {a.get('name','Unnamed alert')} (plugin {a.get('pluginid','?')})")
          PY
