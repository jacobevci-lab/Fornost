name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL / JavaScript
    runs-on: ubuntu-latest
    env:
      CODEQL_EXTRACTOR_JAVASCRIPT_ALLOW_MINIFIED_FILES: "true"
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          output: ../results
      - name: Summarize CodeQL SARIF findings
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          SARIF="../results/javascript.sarif"
          if [[ ! -f "$SARIF" ]]; then
            echo "CodeQL SARIF file was not produced."
            exit 1
          fi
          COUNT=$(jq '[.runs[].results[]?] | length' "$SARIF")
          echo "CodeQL SARIF finding count: $COUNT"
          if [[ "$COUNT" -gt 0 ]]; then
            jq -r '.runs[].results[]? | "- [\(.level // "unknown")] \(.ruleId): \(.message.text)"' "$SARIF"
          fi

  sca:
    name: SCA / npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Resolve dependency graph without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Audit build dependencies
        run: npm audit --audit-level=high
