name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL / JavaScript
    runs-on: ubuntu-latest
    env:
      CODEQL_EXTRACTOR_JAVASCRIPT_ALLOW_MINIFIED_FILES: "true"
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          output: ../results
      - name: Summarize CodeQL SARIF findings
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          SARIF="../results/javascript.sarif"
          if [[ ! -f "$SARIF" ]]; then
            echo "CodeQL SARIF file was not produced."
            exit 1
          fi
          COUNT=$(jq '[.runs[].results[]?] | length' "$SARIF")
          echo "CodeQL SARIF finding count: $COUNT"
          if [[ "$COUNT" -gt 0 ]]; then
            jq -r '.runs[].results[]? | "- [\(.level // "unknown")] \(.ruleId): \(.message.text)"' "$SARIF"
          fi

  sca:
    name: SCA / npm audit + SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Install dependency graph without lifecycle scripts
        run: npm install --ignore-scripts
      - name: Audit build dependencies
        run: npm audit --audit-level=high
      - name: Generate full CycloneDX build-dependency SBOM
        shell: bash
        run: |
          set -euo pipefail
          npm sbom --sbom-format=cyclonedx > security/sbom-build-full.cdx.json
          COMPONENTS=$(jq '[.components[]?] | length' security/sbom-build-full.cdx.json)
          echo "CycloneDX build SBOM component count: $COMPONENTS"
      - name: Upload generated SBOM and resolved lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-evidence
          path: |
            security/sbom-build-full.cdx.json
            package-lock.json
          if-no-files-found: error
          retention-days: 90
